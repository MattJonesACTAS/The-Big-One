<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>The Big One - Preview</title>
  <style>
:root {
  --bg: #ffffff; --bg2: #f5f5f4; --bg3: #ebebeb;
  --txt: #1a1a1a; --txt2: #6b6b6b; --txt3: #9b9b9b;
  --brd: rgba(0,0,0,0.14); --brd2: rgba(0,0,0,0.24);
  --rad: 8px; --rad2: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; background: var(--bg3); overflow: hidden; }
body { height: 100%; display: flex; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; background: var(--bg3); overflow: hidden; }
button { cursor: pointer; -webkit-appearance: none; appearance: none; font-family: inherit; }
.outer { width: 100%; max-width: 390px; background: var(--bg); position: relative; height: 100vh; overflow: hidden; }

.app { display: flex; flex-direction: column; align-items: center; padding: 0.75rem 1rem 0; gap: 0.5rem; position: relative; height: 100vh; overflow: hidden; }
.top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 34px; padding-bottom: 1.4rem; border-bottom: 0.5px solid var(--brd); }
.top-btn { font-size: 11px; color: var(--txt3); background: var(--bg); border: 0.5px solid var(--brd); border-radius: var(--rad); padding: 7px 12px; white-space: nowrap; }
.cease-btn { font-size: 11px; font-weight: 600; font-family: inherit; background: #FFE8E8; border: 0.5px solid #E24B4A; border-radius: var(--rad); color: #A32D2D; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.banner-row { display: flex; gap: 10px; width: 100%; }
.half-banner { flex: 1; }
.rev-banner { background: #EAF2FB; border: 1.5px solid #4A90D9; border-radius: var(--rad); padding: 10px 14px; text-align: center; font-size: 14px; font-weight: 600; color: #1A5EA8; cursor: pointer; font-family: inherit; }
.rosc-banner { background: #FFF0E0; border: 1.5px solid #E6A020; border-radius: var(--rad); padding: 10px 14px; text-align: center; font-size: 14px; font-weight: 600; color: #7A4500; cursor: pointer; font-family: inherit; }
.phea-banner { background: #F0EEF8; border: 1.5px solid #5B4A8A; border-radius: var(--rad); padding: 10px 14px; text-align: center; font-size: 14px; font-weight: 600; color: #5B4A8A; cursor: pointer; font-family: inherit; }

.stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.stat-card { display: flex; flex-direction: column; align-items: center; background: var(--bg2); border-radius: var(--rad); padding: 0.55rem 0.75rem; min-height: 82px; justify-content: center; }
.stat-label { font-size: 11px; color: var(--txt); font-weight: 600; margin-bottom: 2px; }
.stat-value { font-size: 22px; font-weight: 500; color: var(--txt2); font-variant-numeric: tabular-nums; }

.ring-wrap { position: relative; width: 216px; height: 216px; }
.ring-bg { fill: none; stroke: var(--brd); stroke-width: 5; }
.ring-fg { fill: none; stroke: #1D9E75; stroke-width: 5; stroke-linecap: round; }
.timer-display { font-size: 72px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--txt); letter-spacing: 2px; }
.start-btn { width: 162px; height: 162px; border-radius: 81px; border: 0.5px solid var(--brd2); background: var(--bg); color: var(--txt); font-size: 32px; font-weight: 500; }

.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.btn-half { padding: 13px 0; font-size: 14px; font-weight: 500; border-radius: var(--rad); border: 1.5px solid #8ecbb8; background: var(--bg); color: var(--txt); width: 100%; text-align: center; }
  </style>
</head>
<body>
<div class="outer">
  <div class="app">
    <div class="top-bar">
      <button class="top-btn">Reset all</button>
      <button class="cease-btn">Close case</button>
    </div>

    <div class="banner-row">
      <button class="rev-banner half-banner">Reversibles</button>
      <button class="rosc-banner half-banner">ROSC</button>
      <button class="phea-banner half-banner">PHEA</button>
    </div>

    <div style="border:1.5px solid #1D9E75;border-radius:var(--rad2);background:var(--bg);width:100%;overflow:hidden;display:flex;flex-direction:column;position:relative;flex:1;padding-bottom:70px;">
      <div style="display:flex;flex-direction:column;flex:1;">
        <div class="stat-row" style="padding:0.75rem 0.75rem 0.5rem;">
          <div class="stat-card">
            <div class="stat-label">Total elapsed</div>
            <div class="stat-value">2:00</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">CPR round</div>
            <div class="stat-value">1</div>
            <div style="font-size:11px;font-weight:600;margin-top:2px;color:#E24B4A;">Nil Adr. given</div>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;width:100%;padding:1rem 0;">
          <div style="display:flex;align-items:center;justify-content:center;width:100%;margin-top:35px;">
            <div style="width:60px;"></div>
            <div class="ring-wrap">
              <svg width="216" height="216" style="position:absolute;top:0;left:0;">
                <circle class="ring-bg" cx="108" cy="108" r="94.5"/>
                <circle class="ring-fg" cx="108" cy="108" r="94.5" style="transform:rotate(-90deg);transform-origin:108px 108px;stroke-dasharray:594;stroke-dashoffset:445;"/>
              </svg>
              <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap;" class="timer-display">0:09</div>
              <div style="position:absolute;top:75%;left:50%;transform:translate(-50%,-50%);color:var(--txt3);white-space:nowrap;font-size:18px;">COACHED</div>
              <button class="start-btn" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;">START</button>
            </div>
            <div style="width:60px;"></div>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;width:calc(100% - 20px);padding:0;position:absolute;bottom:15px;left:10px;">
          <button style="background:var(--bg2);border:none;border-radius:var(--rad);height:44px;font-size:14px;font-weight:600;color:var(--txt2);">Play</button>
          <button style="background:var(--bg2);border:none;border-radius:var(--rad);height:44px;font-size:14px;font-weight:600;color:var(--txt2);">Refresh</button>
        </div>
      </div>
    </div>

    <div class="btn-row" style="margin-bottom:8px;">
      <button class="btn-half">Running summary</button>
      <button class="btn-half">Add Tx</button>
    </div>

    <div style="display:flex;align-items:center;padding:12px 14px;background:#f5f5f5;border-radius:var(--rad);width:100%;min-height:44px;margin-bottom:10px;">
      <span style="font-size:12px;font-weight:600;color:var(--txt2);flex:1;">Last Tx</span>
      <span style="font-size:14px;font-weight:600;flex:2;text-align:center;">No treatment logged</span>
      <span style="font-size:12px;color:var(--txt2);flex:1;text-align:right;"></span>
    </div>

  </div>
</div>
</body>
</html>
